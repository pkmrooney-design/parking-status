<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>주차장 통계</title>
<style>
  :root{
    --navy: #9c1c2e;
    --navy-dark: #7a1522;
    --blue-tint: #fbebec;
    --line: #ecd9da;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #222c36;
    --text-dim: #64707c;
    --ok: #1e8e5a;
    --busy: #c9660a;
    --full: #c0392b;
    --unknown: #b7bec6;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, sans-serif;
  }

  .gov-header{
    background: var(--navy);
    color: #fff;
    padding: 18px 16px 16px;
    text-align: center;
    border-bottom: 3px solid var(--navy-dark);
  }
  .brand{ display: flex; align-items: center; justify-content: center; gap: 10px; }
  .brand-icon{ flex: none; width: 38px; height: 38px; }
  .org-name{ font-size: 17px; font-weight: 700; color: #fff; text-align: left; margin-bottom: 3px; }
  .gov-header h1{ margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; text-align: left; }
  .gov-header .sub{ margin-top: 4px; font-size: 12.5px; color: #f2cdd2; text-align: left; }

  main{ padding: 18px 16px 50px; }
  .wrap{ max-width: 560px; margin: 0 auto; }

  .panel{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(156,28,46,0.08);
  }

  .quick-row{ display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .quick-btn{
    border: 1px solid var(--line);
    background: var(--blue-tint);
    color: var(--navy);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .quick-btn:hover{ border-color: var(--navy); }

  .range-row{ display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .range-field{ display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 150px; }
  .range-field label{ font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .range-field input{
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
  }
  .query-btn{
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .query-btn:hover{ background: var(--navy-dark); }

  .lot-title{ font-size: 15.5px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }

  .stack-bar{
    display: flex;
    width: 100%;
    height: 18px;
    border-radius: 4px;
    overflow: hidden;
    background: #eef1f4;
    margin-bottom: 12px;
  }
  .stack-seg{ height: 100%; }
  .stack-seg.여유{ background: var(--ok); }
  .stack-seg.혼잡{ background: var(--busy); }
  .stack-seg.만차{ background: var(--full); }
  .stack-seg.기록없음{ background: var(--unknown); }

  table{ width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 4px; }
  table th, table td{ text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table th{ color: var(--text-dim); font-weight: 600; font-size: 12px; }
  .dot{ display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.여유{ background: var(--ok); }
  .dot.혼잡{ background: var(--busy); }
  .dot.만차{ background: var(--full); }
  .dot.기록없음{ background: var(--unknown); }

  details{ margin-top: 10px; }
  summary{ cursor: pointer; font-size: 13px; color: var(--navy); font-weight: 600; }
  .log-list{ list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
  .log-list li{ padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--text-dim); }
  .log-list li b{ color: var(--text); }

  .empty-note{ color: var(--text-dim); font-size: 13px; text-align: center; padding: 10px 0; }

  footer{ text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  footer a{ color: var(--navy); }
</style>
</head>
<body>

<div class="gov-header">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="60" cy="54" r="54" fill="#e3495a"/>
      <path d="M28 96 L46 90 L50 108 L30 112 Z" fill="#7a1522"/>
      <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" fill="#ffffff" text-anchor="middle">P</text>
    </svg>
    <div>
      <div class="org-name">국민건강보험공단 대구수성지사</div>
      <h1>주차장 통계</h1>
      <div class="sub">기간별 여유·혼잡·만차 시간을 확인해요</div>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="panel">
      <div class="quick-row">
        <button class="quick-btn" data-range="today">오늘</button>
        <button class="quick-btn" data-range="yesterday">어제</button>
        <button class="quick-btn" data-range="7days">최근 7일</button>
      </div>
      <div class="range-row">
        <div class="range-field">
          <label for="startInput">시작</label>
          <input type="datetime-local" id="startInput">
        </div>
        <div class="range-field">
          <label for="endInput">종료</label>
          <input type="datetime-local" id="endInput">
        </div>
        <button class="query-btn" id="queryBtn">조회</button>
      </div>
    </div>

    <div id="results"></div>

    <footer>
      ※ 기록은 관리자가 상태를 바꾼 시점부터 쌓입니다. 기록이 시작되기 전 시간은 '기록없음'으로 표시돼요.<br>
      <a href="parking-admin.html">← 관리자 화면으로</a>
    </footer>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAydvkSqvoAVJ--1R4_aZv7ubZgjJUuKNI",
    authDomain: "parkinglotnhis.firebaseapp.com",
    databaseURL: "https://parkinglotnhis-default-rtdb.firebaseio.com",
    projectId: "parkinglotnhis",
    storageBucket: "parkinglotnhis.firebasestorage.app",
    messagingSenderId: "497803256330",
    appId: "1:497803256330:web:4da28a9dbc17ef4e1db5f3"
  };

  const LOTS = [
    { id: 'surface', name: '노면 주차장' },
    { id: 'tower',   name: '주차타워' }
  ];

  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();

  const startInput = document.getElementById('startInput');
  const endInput = document.getElementById('endInput');
  const queryBtn = document.getElementById('queryBtn');
  const resultsEl = document.getElementById('results');

  function pad(n){ return String(n).padStart(2, '0'); }
  function toInputValue(d){
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function endOfDay(d){ const x = new Date(d); x.setHours(23,59,59,999); return x; }

  function setRange(startDate, endDate){
    startInput.value = toInputValue(startDate);
    endInput.value = toInputValue(endDate);
  }

  document.querySelectorAll('[data-range]').forEach(btn => {
    btn.addEventListener('click', () => {
      const now = new Date();
      if(btn.dataset.range === 'today'){
        setRange(startOfDay(now), now);
      } else if(btn.dataset.range === 'yesterday'){
        const y = new Date(now); y.setDate(y.getDate() - 1);
        setRange(startOfDay(y), endOfDay(y));
      } else if(btn.dataset.range === '7days'){
        const s = new Date(now); s.setDate(s.getDate() - 6);
        setRange(startOfDay(s), now);
      }
      runQuery();
    });
  });

  // 기본값: 오늘 00:00 ~ 지금
  setRange(startOfDay(new Date()), new Date());

  function formatDuration(ms){
    if(ms < 60000) return '1분 미만';
    const totalMin = Math.round(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if(h === 0) return `${m}분`;
    if(m === 0) return `${h}시간`;
    return `${h}시간 ${m}분`;
  }

  function formatTs(ts){
    const d = new Date(ts);
    const timeStr = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: true });
    return `${d.getMonth()+1}/${d.getDate()} ${timeStr}`;
  }

  function fetchLog(lotId){
    return db.ref('parking_log/' + lotId).once('value').then(snap => {
      const val = snap.val() || {};
      return Object.values(val)
        .filter(e => e && e.status && e.timestamp)
        .sort((a, b) => a.timestamp - b.timestamp);
    });
  }

  // 로그 항목 i는 "i번째 변경 시각부터 다음 변경 시각 전까지" 그 상태였다는 뜻.
  // 마지막 항목은 지금(조회 종료 시각과 현재 중 더 늦은 쪽)까지 이어진 것으로 본다.
  function buildSegments(entries, rangeEnd){
    return entries.map((e, i) => ({
      status: e.status,
      start: e.timestamp,
      end: (i + 1 < entries.length) ? entries[i + 1].timestamp : Math.max(rangeEnd, Date.now())
    }));
  }

  function computeTotals(segments, rangeStart, rangeEnd){
    const totals = {};
    const firstStart = segments.length ? segments[0].start : null;
    if(firstStart === null){
      totals['기록없음'] = Math.max(0, rangeEnd - rangeStart);
    } else if(firstStart > rangeStart){
      totals['기록없음'] = Math.min(firstStart, rangeEnd) - rangeStart;
    }
    segments.forEach(seg => {
      const s = Math.max(seg.start, rangeStart);
      const e = Math.min(seg.end, rangeEnd);
      if(e > s) totals[seg.status] = (totals[seg.status] || 0) + (e - s);
    });
    return totals;
  }

  function renderLot(lot, entries, rangeStart, rangeEnd){
    const segments = buildSegments(entries, rangeEnd);
    const totals = computeTotals(segments, rangeStart, rangeEnd);
    const windowMs = Math.max(1, rangeEnd - rangeStart);
    const order = ['여유', '혼잡', '만차', '기록없음'];
    const rows = order.filter(k => totals[k] > 0);

    let barHtml = '';
    let tableHtml = '';
    if(rows.length === 0){
      barHtml = `<div class="empty-note">이 기간에는 기록이 없습니다.</div>`;
    } else {
      barHtml = `<div class="stack-bar">` +
        rows.map(k => `<div class="stack-seg ${k}" style="width:${(totals[k]/windowMs*100).toFixed(2)}%"></div>`).join('') +
        `</div>`;
      tableHtml = `
        <table>
          <thead><tr><th>상태</th><th>시간</th><th>비율</th></tr></thead>
          <tbody>
            ${rows.map(k => `
              <tr>
                <td><span class="dot ${k}"></span>${k}</td>
                <td>${formatDuration(totals[k])}</td>
                <td>${(totals[k]/windowMs*100).toFixed(0)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    const logsInRange = entries.filter(e => e.timestamp >= rangeStart && e.timestamp <= rangeEnd);
    const logHtml = logsInRange.length
      ? `<ul class="log-list">${logsInRange.slice().reverse().map(e => `<li>${formatTs(e.timestamp)} — <b>${e.status}</b></li>`).join('')}</ul>`
      : `<div class="empty-note" style="padding:4px 0;">이 기간에 상태 변경 기록이 없습니다.</div>`;

    return `
      <div class="panel">
        <div class="lot-title">${lot.name}</div>
        ${barHtml}
        ${tableHtml}
        <details>
          <summary>변경 로그 보기 (${logsInRange.length}건)</summary>
          ${logHtml}
        </details>
      </div>
    `;
  }

  function runQuery(){
    const rangeStart = new Date(startInput.value).getTime();
    const rangeEnd = new Date(endInput.value).getTime();
    if(!rangeStart || !rangeEnd || rangeStart >= rangeEnd){
      resultsEl.innerHTML = `<div class="panel"><div class="empty-note">시작 시각이 종료 시각보다 빨라야 합니다.</div></div>`;
      return;
    }
    resultsEl.innerHTML = `<div class="panel"><div class="empty-note">불러오는 중…</div></div>`;

    Promise.all(LOTS.map(lot => fetchLog(lot.id))).then(results => {
      resultsEl.innerHTML = LOTS.map((lot, i) => renderLot(lot, results[i], rangeStart, rangeEnd)).join('');
    }).catch(err => {
      resultsEl.innerHTML = `<div class="panel"><div class="empty-note">불러오기에 실패했습니다: ${err.message}</div></div>`;
    });
  }

  queryBtn.addEventListener('click', runQuery);
  runQuery();
})();
</script>
</body>
</html>
