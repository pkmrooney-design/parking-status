
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>주차장 관리자</title>

<style>
:root {
  --navy: #9c1c2e;
  --navy-dark: #7a1522;
  --blue-tint: #fbebec;
  --line: #ecd9da;
  --bg: #f4f6f8;
  --card: #fff;
  --text: #222c36;
  --text-dim: #64707c;
  --ok: #1e8e5a;
  --ok-bg: #e5f4ec;
  --busy: #c9660a;
  --busy-bg: #fbebdb;
  --full: #c0392b;
  --full-bg: #fce6e3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo',
               -apple-system, sans-serif;
}

/* 로그인 화면 */
#adminLoginGate {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--bg);
}

#adminLoginBox {
  width: 100%;
  max-width: 360px;
  padding: 28px 24px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 4px 20px #00000012;
}

#adminLoginBox h2 {
  margin-top: 0;
  color: var(--navy);
  text-align: center;
  font-size: 21px;
}

#adminLoginBox label {
  display: block;
  font-size: 14px;
  font-weight: 700;
}

#adminLoginBox input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 9px 0 16px;
  border: 1px solid #ccd2d8;
  border-radius: 5px;
  font-size: 16px;
}

#adminLoginBox button {
  width: 100%;
  padding: 13px;
  background: var(--navy);
  color: white;
  border: 0;
  border-radius: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#adminLoginError {
  color: var(--full);
  font-size: 13px;
  text-align: center;
  line-height: 1.5;
}

.login-note {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

/* 관리자 화면 */
#adminApp { display: none; }

.gov-header {
  background: var(--navy);
  color: #fff;
  padding: 18px 16px 16px;
  border-bottom: 3px solid var(--navy-dark);
}

.header-inner {
  max-width: 480px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  flex: none;
  width: 38px;
  height: 38px;
}

.brand-text { flex: 1; min-width: 0; }

.org-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 3px;
}

.gov-header h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
}

.gov-header .sub {
  margin-top: 4px;
  font-size: 12px;
  color: #f2cdd2;
}

.logout-btn {
  flex: none;
  padding: 8px 10px;
  color: #fff;
  background: transparent;
  border: 1px solid #ffffff99;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}

#connBar {
  text-align: center;
  font-size: 12.5px;
  color: var(--text-dim);
  background: var(--blue-tint);
  border-bottom: 1px solid var(--line);
  padding: 9px 8px;
}

#connBar.on { color: var(--ok); }
#connBar.off { color: var(--full); }

main { padding: 18px 16px 50px; }

.lots {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.lot-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px 18px;
  box-shadow: 0 1px 2px rgba(156,28,46,0.08);
}

.lot-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.lot-name {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--navy);
}

.lot-status-badge {
  font-size: 12.5px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 3px;
}

.lot-status-badge.여유 {
  color: var(--ok);
  background: var(--ok-bg);
}

.lot-status-badge.혼잡 {
  color: var(--busy);
  background: var(--busy-bg);
}

.lot-status-badge.만차 {
  color: var(--full);
  background: var(--full-bg);
}

.lot-status-badge.미설정 {
  color: var(--text-dim);
  background: #eef1f4;
}

.lot-updated {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 14px;
}

.btn-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.status-btn {
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 16px 5px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: filter 0.15s ease, border-color 0.15s ease;
}

.status-btn:active { filter: brightness(0.96); }
.status-btn.dim { opacity: 0.55; }

.status-btn.active {
  border-color: currentColor;
  box-shadow: inset 0 0 0 1px currentColor;
}

.confirm-btn {
  width: 100%;
  margin-top: 10px;
  padding: 11px 10px;
  border: 1px dashed var(--navy);
  border-radius: 4px;
  background: #fff;
  color: var(--navy);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.confirm-btn:active { background: var(--blue-tint); }

.btn-ok { background: var(--ok-bg); color: var(--ok); }
.btn-busy { background: var(--busy-bg); color: var(--busy); }
.btn-full { background: var(--full-bg); color: var(--full); }

footer {
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.9;
}

footer a { color: var(--navy); }

@media (max-width: 360px) {
  .org-name { font-size: 13px; }
  .gov-header h1 { font-size: 17px; }
  .brand { gap: 7px; }
  .brand-icon { width: 32px; height: 32px; }
  .logout-btn { padding: 7px; }
}
</style>
</head>

<body>

<!-- 로그인 화면 -->
<div id="adminLoginGate">
  <div id="adminLoginBox">
    <h2>주차장 관리자 로그인</h2>

    <form id="adminLoginForm">
      <label for="adminId">아이디</label>
      <input
        id="adminId"
        type="text"
        placeholder="관리자 아이디 입력"
        autocomplete="username"
        required
      >

      <label for="adminPw">비밀번호</label>
      <input
        id="adminPw"
        type="password"
        placeholder="비밀번호 입력"
        autocomplete="current-password"
        required
      >

      <button type="submit">로그인</button>
      <p id="adminLoginError" role="alert"></p>
      <p class="login-note">
        관리자 전용 페이지입니다.
      </p>
    </form>
  </div>
</div>

<!-- 로그인 후 표시되는 관리자 화면 -->
<div id="adminApp">

  <header class="gov-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 120 120"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="60" cy="54" r="54" fill="#e3495a"/>
          <path d="M28 96 L46 90 L50 108 L30 112 Z"
                fill="#7a1522"/>
          <text x="60" y="72" font-family="Arial, Helvetica, sans-serif"
                font-weight="800" font-size="58" fill="#ffffff"
                text-anchor="middle">P</text>
        </svg>

        <div class="brand-text">
          <div class="org-name">국민건강보험공단 대구수성지사</div>
          <h1>주차장 관리자</h1>
          <div class="sub">버튼을 누르면 사용자 화면에 바로 반영돼요</div>
        </div>

        <button type="button" class="logout-btn" id="logoutBtn">
          로그아웃
        </button>
      </div>
    </div>
  </header>

  <div id="connBar">연결 확인 중…</div>

  <main>
    <div class="lots" id="lots"></div>

    <footer>
      사용자 화면 미리보기:
      <a href="parking.html" target="_blank" rel="noopener">
        parking.html →
      </a>
      <br>

      통계 보기:
      <a href="parking-stats.html" target="_blank" rel="noopener">
        parking-stats.html →
      </a>
      <br>

      <span style="opacity:.75;">
        이 관리자 페이지 링크는 상태를 바꿀 수 있으니 관리자끼리만 공유하세요.
      </span>
    </footer>
  </main>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(function () {
  'use strict';

  // ==========================================
  // 1. 관리자 아이디 및 비밀번호
  // ==========================================
  const ADMIN_ID = 'NHIS';
  const ADMIN_PASSWORD = 'nhis1234!';

  const SESSION_KEY = 'parkingAdminLogin';

  const gate = document.getElementById('adminLoginGate');
  const adminApp = document.getElementById('adminApp');
  const loginForm = document.getElementById('adminLoginForm');
  const loginError = document.getElementById('adminLoginError');

  function isLoggedIn() {
    return sessionStorage.getItem(SESSION_KEY) === 'yes';
  }

  function showLogin() {
    adminApp.style.display = 'none';
    gate.style.display = 'flex';
    loginForm.reset();
    loginError.textContent = '';
  }

  function showAdmin() {
    gate.style.display = 'none';
    adminApp.style.display = 'block';
  }

  // 로그인 상태에 따라 화면 결정
  if (isLoggedIn()) {
    showAdmin();
  } else {
    showLogin();
  }

  // 로그인 처리
  loginForm.addEventListener('submit', function (event) {
    event.preventDefault();

    const id = document.getElementById('adminId').value.trim();
    const pw = document.getElementById('adminPw').value;

    if (id === ADMIN_ID && pw === ADMIN_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, 'yes');
      loginError.textContent = '';
      showAdmin();
    } else {
      loginError.textContent =
        '아이디 또는 비밀번호가 올바르지 않습니다.';
      document.getElementById('adminPw').value = '';
      document.getElementById('adminPw').focus();
    }
  });

  // 로그아웃
  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem(SESSION_KEY);
    showLogin();
  });

  // ==========================================
  // 2. Firebase 설정
  // ==========================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAydvkSqvoAVJ--1R4_aZv7ubZgjJUuKNI",
    authDomain: "parkinglotnhis.firebaseapp.com",
    databaseURL: "https://parkinglotnhis-default-rtdb.firebaseio.com",
    projectId: "parkinglotnhis",
    storageBucket: "parkinglotnhis.firebasestorage.app",
    messagingSenderId: "497803256330",
    appId: "1:497803256330:web:4da28a9dbc17ef4e1db5f3"
  };

  const LOTS = [
    { id: 'surface', name: '노면 주차장' },
    { id: 'tower', name: '주차타워' }
  ];

  const STATUSES = [
    { key: '여유', cls: 'btn-ok' },
    { key: '혼잡', cls: 'btn-busy' },
    { key: '만차', cls: 'btn-full' }
  ];

  const lotsEl = document.getElementById('lots');
  const connBar = document.getElementById('connBar');
  const state = {};

  let dbRef = null;
  let initialized = false;

  // ==========================================
  // 3. 시간 및 상태 표시
  // ==========================================
  function formatUpdated(ts) {
    if (!ts) return '아직 기록 없음';

    const d = new Date(ts);
    const now = new Date();

    const timeStr = d.toLocaleTimeString('ko-KR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    });

    if (d.toDateString() === now.toDateString()) {
      return '마지막 확인 ' + timeStr;
    }

    return '마지막 확인 ' +
      (d.getMonth() + 1) + '월 ' +
      d.getDate() + '일 ' + timeStr;
  }

  function todayStr() {
    const d = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];

    return d.getFullYear() + '년 ' +
      (d.getMonth() + 1) + '월 ' +
      d.getDate() + '일 (' + days[d.getDay()] + ')';
  }

  // ==========================================
  // 4. 주차장 카드 표시
  // ==========================================
  function render() {
    lotsEl.innerHTML = LOTS.map(function (lot) {
      const s = state[lot.id] || {};
      const status = s.status || '미설정';

      return `
        <div class="lot-card">
          <div class="lot-head">
            <span class="lot-name">${lot.name}</span>
            <span class="lot-status-badge ${status}">${status}</span>
          </div>

          <div class="lot-updated">
            ${formatUpdated(s.updatedAt)}
          </div>

          <div class="btn-grid">
            ${STATUSES.map(function (st) {
              return `
                <button
                  type="button"
                  class="status-btn ${st.cls} ${
                    s.status === st.key ? 'active' : 'dim'
                  }"
                  data-lot="${lot.id}"
                  data-status="${st.key}">
                  ${st.key}
                </button>
              `;
            }).join('')}
          </div>

          ${s.status ? `
            <button
              type="button"
              class="confirm-btn"
              data-lot="${lot.id}"
              data-status="${s.status}">
              ✔ 현재 상태(${s.status}) 그대로 확인
            </button>
          ` : ''}
        </div>
      `;
    }).join('');

    lotsEl.querySelectorAll('.status-btn, .confirm-btn')
      .forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!isLoggedIn()) {
            showLogin();
            return;
          }

          setStatus(btn.dataset.lot, btn.dataset.status);
        });
      });
  }

  // ==========================================
  // 5. 주차 상태 변경 및 통계 기록
  // ==========================================
  function setStatus(lotId, status) {
    if (!isLoggedIn()) {
      showLogin();
      return;
    }

    if (!dbRef) {
      alert('서버에 연결되지 않았습니다. 잠시 후 다시 시도해주세요.');
      return;
    }

    const ts = firebase.database.ServerValue.TIMESTAMP;
    const changed = (state[lotId] || {}).status !== status;

    dbRef.child('parking/' + lotId).update({
      status: status,
      updatedAt: ts
    }).catch(function (error) {
      console.error('주차 상태 저장 실패:', error);
      alert('주차 상태 저장에 실패했습니다. 연결 및 데이터베이스 규칙을 확인해주세요.');
    });

    // 상태가 바뀐 경우에만 통계 로그 추가
    if (changed) {
      dbRef.child('parking_log/' + lotId).push({
        status: status,
        timestamp: ts
      }).catch(function (error) {
        console.error('통계 로그 저장 실패:', error);
        alert('통계 로그 저장에 실패했습니다. 데이터베이스 규칙을 확인해주세요.');
      });
    }
  }

  // ==========================================
  // 6. Firebase 실시간 연결
  // ==========================================
  function init() {
    if (initialized) return;
    initialized = true;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }

      const db = firebase.database();
      dbRef = db.ref();

      db.ref('.info/connected').on('value', function (snap) {
        if (snap.val()) {
          connBar.textContent = '🟢 실시간 연결됨 · ' + todayStr();
          connBar.className = 'on';
        } else {
          connBar.textContent = '🔴 연결 끊김 · 재접속 중…';
          connBar.className = 'off';
        }
      });

      LOTS.forEach(function (lot) {
        db.ref('parking/' + lot.id).on('value', function (snap) {
          state[lot.id] = snap.val() || {};
          render();
        }, function (error) {
          console.error('주차 현황 읽기 실패:', error);
          connBar.textContent = '🔴 데이터 접근 실패 · Firebase 규칙을 확인하세요';
          connBar.className = 'off';
        });
      });

    } catch (error) {
      console.error('Firebase 초기화 실패:', error);
      connBar.textContent = '🔴 서버 초기화 실패';
      connBar.className = 'off';
    }
  }

  // 초기 카드 표시
  render();

  // Firebase 연결은 로그인 후 시작
  if (isLoggedIn()) {
    init();
  }

  // 로그인 성공 시 Firebase 연결 시작
  loginForm.addEventListener('submit', function () {
    if (isLoggedIn()) {
      init();
    }
  });

  // ==========================================
  // 7. 매시 정각 자동 새로고침
  // 오전 9시부터 오후 6시까지
  // ==========================================
  function checkAutoRefresh() {
    if (!isLoggedIn()) return;

    const now = new Date();
    const hour = now.getHours();
    const minute = now.getMinutes();

    if (hour >= 9 && hour <= 18 && minute === 0) {
      const dateKey =
        now.getFullYear() + '-' +
        (now.getMonth() + 1) + '-' +
        now.getDate() + '-' + hour;

      const storageKey = 'parkingAutoReload';

      if (sessionStorage.getItem(storageKey) !== dateKey) {
        sessionStorage.setItem(storageKey, dateKey);
        location.reload();
      }
    }
  }

  checkAutoRefresh();
  setInterval(checkAutoRefresh, 10000);

})();
</script>

</body>
</html>
